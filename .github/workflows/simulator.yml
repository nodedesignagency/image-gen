name: Simulator

# Builds the app, runs the hands-free demo (-autopilot YES) in an iPhone
# simulator and uploads a screen recording plus screenshots as an artifact.

on:
  push:
    branches: [claude/affectionate-galileo-lrgc2w]
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  demo:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -E 'Xcode_[0-9.]+\.app$' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Decode.xcodeproj \
            -target Decode \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Debug-iphonesimulator/Decode.app
          codesign --force --sign - --timestamp=none build/Debug-iphonesimulator/Decode.app

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(x) for x in runtime.split("iOS-")[-1].split("-"))
              for device in devices:
                  name = device["name"]
                  if name.startswith("iPhone") and name.endswith("Pro"):
                      key = (version, name)
                      if best is None or key > best[0]:
                          best = (key, device["udid"])
          print(best[1])
          print(best[0], file=sys.stderr)
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/Decode.app
          # Settle the simulator before recording.
          sleep 10

      - name: Record autopilot demo
        run: |
          mkdir -p out
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force out/decode-demo.mp4 &
          REC=$!
          sleep 3
          xcrun simctl launch "$UDID" com.nodedesign.decode -autopilot YES
          for i in $(seq -w 1 26); do
            sleep 2
            xcrun simctl io "$UDID" screenshot "out/shot-$i.png" > /dev/null 2>&1 || true
          done
          sleep 2
          kill -INT "$REC"
          wait "$REC" || true
          ls -la out

      - name: Collect logs
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "Decode"' > out/app-log.txt 2>/dev/null || true
          find ~/Library/Logs/DiagnosticReports -iname "*Decode*" -exec cp {} out/ \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-output
          path: out/
          retention-days: 14
