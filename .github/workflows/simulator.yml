name: Simulator

# PROFILING (side branch only): runs the autopilot demo under Instruments'
# Time Profiler for the current app, the current app with Reduce effects,
# and the first version (b814a2f), and summarises where CPU time goes.

on:
  push:
    branches: [claude/affectionate-galileo-lrgc2w]
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  profile:
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -E 'Xcode_[0-9.]+\.app$' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build current (scripts/run.sh) and first version
        run: |
          /bin/bash ./scripts/run.sh --no-launch
          UDID=$(xcrun simctl list devices booted | awk '/iPhone/ && match($0, /\([0-9A-F-]+\)/) { print substr($0, RSTART + 1, RLENGTH - 2); exit }')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl ui "$UDID" appearance light
          git worktree add "$RUNNER_TEMP/first" b814a2f
          (cd "$RUNNER_TEMP/first" && xcodebuild -project Decode.xcodeproj -target Decode -configuration Debug -sdk iphonesimulator -arch "$(uname -m)" SYMROOT="$RUNNER_TEMP/first/build" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/first-build.log" 2>&1) || { tail -40 "$RUNNER_TEMP/first-build.log"; exit 1; }
          codesign --force --sign - --timestamp=none "$RUNNER_TEMP/first/build/Debug-iphonesimulator/Decode.app"
          sleep 10

      - name: Profile variants
        run: |
          mkdir -p out
          prof() {
            NAME=$1; APP=$2; shift 2
            echo "::group::$NAME"
            xcrun simctl terminate "$UDID" com.nodedesign.decode 2>/dev/null || true
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" com.nodedesign.decode > /dev/null; sleep 6
            xcrun simctl terminate "$UDID" com.nodedesign.decode || true; sleep 2
            OUT=$(xcrun simctl launch "$UDID" com.nodedesign.decode -autopilot YES "$@")
            echo "$OUT"; PID=${OUT##*: }
            date +%T.%N > "out/$NAME.launch"
            sleep 9
            date +%T.%N > "out/$NAME.trace-start"
            sudo xcrun xctrace record --template 'Time Profiler' --all-processes --time-limit 24s --output "out/$NAME.trace" > "out/$NAME.record.log" 2>&1 || true
            cat "out/$NAME.record.log"
            if [ ! -e "out/$NAME.trace" ]; then
              echo "all-processes failed; attaching to $PID"
              sudo xcrun xctrace record --template 'Time Profiler' --attach "$PID" --time-limit 20s --output "out/$NAME.trace" || true
            fi
            sudo chown -R "$(whoami)" out
            xcrun xctrace export --input "out/$NAME.trace" --toc > "out/$NAME.toc.xml" || true
            xcrun xctrace export --input "out/$NAME.trace" --xpath '/trace-toc/run[@number="1"]/data/table[@schema="time-profile"]' > "out/$NAME.xml" || true
            ls -la "out/$NAME.xml"
            python3 .github/perf/summarize.py "out/$NAME.xml" > "out/$NAME.txt" 2>&1 || true
            head -60 "out/$NAME.txt"
            rm -f "out/$NAME.xml"
            echo "::endgroup::"
          }
          prof current build/Debug-iphonesimulator/Decode.app
          prof current-reduce build/Debug-iphonesimulator/Decode.app -reduceEffects YES
          prof first "$RUNNER_TEMP/first/build/Debug-iphonesimulator/Decode.app"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-summaries
          path: |
            out/*.txt
            out/*.log
            out/*.toc.xml
            out/*.launch
            out/*.trace-start
          retention-days: 7
