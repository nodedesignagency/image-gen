name: Simulator

# PERF EXPERIMENT (side branch only): records the autopilot demo once per
# variant and reports frame pacing, to find what makes Create heavy.

on:
  push:
    branches: [claude/affectionate-galileo-lrgc2w]
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  demo:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -E 'Xcode_[0-9.]+\.app$' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          which ffprobe || brew install ffmpeg

      - name: Build, boot and install (scripts/run.sh)
        run: |
          /bin/bash ./scripts/run.sh --no-launch
          UDID=$(xcrun simctl list devices booted | awk '/iPhone/ && match($0, /\([0-9A-F-]+\)/) { print substr($0, RSTART + 1, RLENGTH - 2); exit }')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100
          xcodebuild -project Decode.xcodeproj -target Decode -configuration Release -sdk iphonesimulator -arch "$(uname -m)" SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build > build/build-release.log 2>&1 || { tail -50 build/build-release.log; exit 1; }
          codesign --force --sign - --timestamp=none build/Release-iphonesimulator/Decode.app
          sleep 10

      - name: Record variants
        run: |
          mkdir -p out
          rec() {
            NAME=$1; shift
            xcrun simctl terminate "$UDID" com.nodedesign.decode || true
            sleep 2
            xcrun simctl io "$UDID" recordVideo --codec=h264 --force "out/$NAME.mp4" > rec.log 2>&1 &
            REC=$!
            for _ in $(seq 1 120); do grep -q "Recording started" rec.log && break; sleep 0.5; done
            sleep 1
            xcrun simctl launch "$UDID" com.nodedesign.decode -autopilot YES "$@"
            sleep 42
            kill -INT "$REC"; wait "$REC" || true
          }
          xcrun simctl launch "$UDID" com.nodedesign.decode; sleep 8
          rec debug-default
          xcrun simctl install "$UDID" build/Release-iphonesimulator/Decode.app
          xcrun simctl launch "$UDID" com.nodedesign.decode; sleep 8
          rec release-default
          rec release-noLens -edgeLens NO
          rec release-noGlass -perfNoGlass YES
          rec release-noBlur -perfNoBlur YES
          rec release-noWash -perfNoWash YES
          rec release-reduce -reduceEffects YES
          rec release-default2
          for f in out/*.mp4; do
            echo "== $f"
            ffprobe -v error -select_streams v:0 -show_entries frame=pts_time -of csv=p=0 "$f" > "${f%.mp4}.ts"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-timestamps
          path: |
            out/*.ts
            build/*.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-videos
          path: out/*.mp4
          retention-days: 3
