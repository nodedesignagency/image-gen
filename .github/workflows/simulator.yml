name: Simulator

# Builds the app, runs the hands-free demo (-autopilot YES) in an iPhone
# simulator and uploads a screen recording plus screenshots as an artifact.

on:
  push:
    branches: [claude/affectionate-galileo-lrgc2w]
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  demo:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -E 'Xcode_[0-9.]+\.app$' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # Same script you run locally, so CI proves it works on a fresh Mac.
      - name: Build, boot and install (scripts/run.sh)
        run: |
          # macOS's stock /bin/bash (3.2), the shell your Mac uses for this script.
          /bin/bash --version | head -1
          /bin/bash ./scripts/run.sh --no-launch
          UDID=$(xcrun simctl list devices booted | awk '/iPhone/ && match($0, /\([0-9A-F-]+\)/) { print substr($0, RSTART + 1, RLENGTH - 2); exit }')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          # Settle the simulator before recording.
          sleep 10

      - name: Record autopilot demo
        run: |
          mkdir -p out
          # Warm-up launch so the recorded launch is quick.
          xcrun simctl launch "$UDID" com.nodedesign.decode
          sleep 8
          xcrun simctl terminate "$UDID" com.nodedesign.decode || true
          sleep 2

          xcrun simctl io "$UDID" recordVideo --codec=h264 --force out/decode-demo.mp4 > recorder.log 2>&1 &
          REC=$!
          for _ in $(seq 1 120); do
            grep -q "Recording started" recorder.log && break
            sleep 0.5
          done
          cat recorder.log
          sleep 1

          xcrun simctl launch "$UDID" com.nodedesign.decode -autopilot YES -edgeLens YES
          sleep 58
          xcrun simctl io "$UDID" screenshot out/final.png > /dev/null 2>&1 || true

          kill -INT "$REC"
          wait "$REC" || true
          ls -la out

      - name: Collect logs
        if: always()
        run: |
          mkdir -p out
          cp build/build.log out/ 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "Decode"' > out/app-log.txt 2>/dev/null || true
          find ~/Library/Logs/DiagnosticReports -iname "*Decode*" -exec cp {} out/ \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-output
          path: out/
          retention-days: 14
